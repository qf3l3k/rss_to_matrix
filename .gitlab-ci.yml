include:
  - project: templates/ci-templates
    ref: v1.0.0
    file: /.gitlab/github-mirror.yml

stages:
  - quality
  - package
  - mirror

variables:
  # Every job gets an isolated checkout and virtualenv on the selected runner.
  GIT_STRATEGY: clone
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MINIMUM_PYTHON: "3.10"
  PYTHON_COMMAND: "python3"

default:
  # Docker/Kubernetes executors use this image. Shell executors ignore it and
  # must provide Python 3.10 or newer as `python3` on the runner host.
  image: python:3.13-slim
  interruptible: true
  cache:
    key: "pip-${CI_JOB_NAME}"
    paths:
      - .cache/pip/
  before_script:
    - ./scripts/ci-bootstrap.sh

quality:
  stage: quality
  script:
    - PYTHON="$CI_PROJECT_DIR/.ci-venv/bin/python" ./scripts/check.sh
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

package:
  stage: package
  script:
    - "$CI_PROJECT_DIR/.ci-venv/bin/python -m build"
  artifacts:
    paths:
      - dist/

# The included mirror job only needs Git; skip the Python project bootstrap.
github_mirror_publish:
  before_script: []
