[project]
name = "rss-to-matrix"
dynamic = ["version"]
description = "Post RSS and Atom feed updates to Matrix rooms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
rss-to-matrix = "rss_to_matrix.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rss_to_matrix"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "rss_to_matrix.__version__" }

[tool.mypy]
python_version = "3.10"
files = ["src/rss_to_matrix"]
strict = true

[[tool.mypy.overrides]]
module = ["feedparser", "tomli"]
ignore_missing_imports = true
